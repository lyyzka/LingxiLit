name: Publish / LingxiLit

on:
  push:
    branches: [main]
    paths-ignore:
      - docker-compose.yml
  workflow_dispatch:

concurrency:
  group: publish-lingxilit
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.repository == 'lyyzka/LingxiLit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/lyyzka/lingxilit
          tags: |
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin deployment to the published image
        run: |
          sed -i -E "s#image: accel\.way2api\.fun/ghcr\.io/lyyzka/lingxilit:[^[:space:]]+#image: accel.way2api.fun/ghcr.io/lyyzka/lingxilit:sha-${GITHUB_SHA}#" docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git diff --cached --quiet || git commit -m "deploy: pin LingxiLit image to sha-${GITHUB_SHA}"
          git push
